# AI Starter 配置示例
# 复制此文件为 config.yaml 并填写实际配置
#
# 注意：智谱AI API Key 不在此配置文件中，请设置环境变量：
#   export ZHIPUAI_API_KEY="your_api_key_here"

# ==================== HTTP 客户端配置 ====================
http:
  # 代理配置
  proxy:
    enabled: true                          # 是否启用代理
    http: "http://10.200.86.85:8080"      # HTTP 代理地址
    https: "http://10.200.86.85:8080"     # HTTPS 代理地址

  # 超时配置（秒）
  timeout: 30

  # SSL 验证
  verify_ssl: false                        # 公司内网环境可能需要设为 false

# ==================== 智谱AI 配置 ====================
zhipu:
  # API Base URL（必填）
  api_base: "https://open.bigmodel.cn/api/paas/v4/"

  # LLM 配置
  llm:
    model: "glm-4-flash"                   # 模型名称
    temperature: 0.7                       # 温度参数

  # Embedding 配置
  embedding:
    model: "embedding-2"                   # 嵌入模型名称

# ==================== ChromaDB 配置 ====================
chromadb:
  # 服务器地址
  host: "localhost"
  port: 8000

  # 认证信息（无认证时删除以下两行）
  # username: "admin"
  # password: "admin"

# ==================== 日志配置 ====================
logging:
  level: "INFO"                            # DEBUG, INFO, WARNING, ERROR, CRITICAL
  file: "logs/app.log"                     # 日志文件路径（留空字符串则不写文件）
