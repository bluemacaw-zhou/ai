[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-starter"
version = "0.1.0.dev"
description = "AI 工作区共享工具包"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
chromadb = [
    "chromadb>=1.2.0",
]
embedding = [
    "zhipuai>=2.1.0",
    "sniffio>=1.3.0",
]
langchain = [
    "langchain-core>=0.1.0",
    "langchain-community>=0.1.0",
    "langchain-text-splitters>=0.1.0",
    "pypdf>=4.0.0",
]
llama-index = [
    "llama-index-core>=0.10.0",
    "llama-index-llms-openai-like>=0.1.0",
    "llama-index-embeddings-openai-like>=0.1.0",
]
qwen-agent = [
    "qwen-agent[rag]",
]
all = [
    "chromadb>=1.2.0",
    "zhipuai>=2.1.0",
    "sniffio>=1.3.0",
    "langchain-core>=0.1.0",
    "langchain-community>=0.1.0",
    "langchain-text-splitters>=0.1.0",
    "pypdf>=4.0.0",
    "llama-index-core>=0.10.0",
    "llama-index-llms-openai-like>=0.1.0",
    "llama-index-embeddings-openai-like>=0.1.0",
    "qwen-agent[rag]",
]

[tool.uv]
index-url = "http://10.100.1.27:8688/repository/Pypi-group/simple"
package = true
