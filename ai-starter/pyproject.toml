[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-starter"
version = "0.1.0.dev"
description = "AI 工作区共享工具包"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Embedding 功能（独立安装）
embedding = [
    "zhipuai>=2.1.0",
    "sniffio>=1.3.0",
]

# ChromaDB 功能（自动包含 embedding 依赖）
chromadb = [
    "chromadb>=1.2.0",
    "zhipuai>=2.1.0",     # 从 embedding 继承
    "sniffio>=1.3.0",     # 从 embedding 继承
]

# LangChain 功能
langchain = [
    "langchain-core>=0.1.0",
    "langchain-community>=0.1.0",
    "langchain-text-splitters>=0.1.0",
    "pypdf>=4.0.0",
]

# LlamaIndex 功能
llama-index = [
    "llama-index-core>=0.10.0",
    "llama-index-llms-openai-like>=0.1.0",
    "llama-index-embeddings-openai-like>=0.1.0",
]

# Qwen-Agent 功能
qwen-agent = [
    "qwen-agent[rag]",
]

# 全部功能
all = [
    "chromadb>=1.2.0",
    "zhipuai>=2.1.0",
    "sniffio>=1.3.0",
    "langchain-core>=0.1.0",
    "langchain-community>=0.1.0",
    "langchain-text-splitters>=0.1.0",
    "pypdf>=4.0.0",
    "llama-index-core>=0.10.0",
    "llama-index-llms-openai-like>=0.1.0",
    "llama-index-embeddings-openai-like>=0.1.0",
    "qwen-agent[rag]",
]

[tool.uv]
index-url = "http://10.100.1.27:8688/repository/Pypi-group/simple"
package = true
