[project]
name = "workflow-demo"
version = "0.1.0"
description = "LlamaIndex Workflow demo - Text-to-SQL with table retrieval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # LlamaIndex 核心
    "llama-index>=0.12.0",
    "llama-index-core>=0.12.0",

    # LlamaIndex OpenAI 兼容集成（用于智谱AI的OpenAI兼容接口）
    "llama-index-llms-openai-like>=0.1.0",
    "llama-index-embeddings-openai-like>=0.1.0",

    # AI Starter（本地开发库）
    "ai-starter[llama-index]",

    # 数据处理
    "pandas>=2.0.0",

    # 数据库
    "sqlalchemy>=2.0.0",
]

[tool.uv]
index-url = "http://10.100.1.27:8688/repository/Pypi-group/simple"
package = false

[tool.uv.sources]
ai-starter = { path = "../ai-starter", editable = true }
