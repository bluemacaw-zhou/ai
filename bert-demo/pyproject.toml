[project]
name = "bert-demo"
version = "0.1.0"
description = "BERT Chinese sentiment classification demo"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ai-starter",
    "torch==2.8.0",
    "transformers>=4.45,<5",
    "datasets>=3,<4",
]

[tool.uv]
package = false

[tool.uv.sources]
ai-starter = { path = "../ai-starter", editable = true }
