[project]
name = "chat-agent"
version = "0.2.0"
description = "LangGraph chat agent with a FastAPI HTTP interface."
readme = "../README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "langgraph>=1.0.0",
  "langchain>=1.3.0",
  "langchain-openai>=0.2.0",
  "langchain-mcp-adapters>=0.3.0",
  "mcp>=1.26.0,<2.0.0",
  "pyyaml>=6.0",
  "httpx>=0.27.0",
  "structlog>=24.0.0",
  "opentelemetry-api>=1.0.0",
  "opentelemetry-sdk>=1.0.0",
]

[tool.uv]
index-url = "http://10.100.1.27:8688/repository/Pypi-group/simple"
package = false
