# Pure LangGraph runtime configuration.
logging:
  level: "INFO"

llm:
  agents:
    default:
      provider: "openai_compatible"
      api_base: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      model: "qwen-plus"
      api_key: "${QWEN_API_KEY}"
      temperature: 0
      max_tokens: null
      http:
        proxy:
          enabled: true
          http: "http://10.200.86.85:8080"
          https: "http://10.200.86.85:8080"
        timeout: 60
        verify_ssl: false

# Deliberately empty: add real MCP sources only in the target environment.
mcp:
  servers: {}
