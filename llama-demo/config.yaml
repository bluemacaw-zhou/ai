# LlamaIndex RAG Pipeline 配置文件
# 请将此文件复制为 config.yaml 并填写实际配置

# ==================== LlamaIndex 配置 ====================
llama:
  # 文档数据路径
  data_path: "./data"

  # 是否重建知识库（true: 重新构建, false: 从现有 collection 加载）
  build_knowledge_base: true

  # 文档分割配置
  chunk_size: 512          # 文本块大小
  chunk_overlap: 200       # 文本块重叠大小

  # 检索配置
  similarity_top_k: 5      # 检索召回 top k 结果
  num_queries: 3           # RAG Fusion 生成的查询数量

  # Rerank 配置
  rerank_top_n: 2          # Rerank 后保留的文档数
  similarity_cutoff: 0.6   # 相似度过滤阈值（低于此分数的文档被过滤）

# ==================== 智谱AI 配置 ====================
api:
  zhipuai:
    # API Key（必填）
    key: "your-zhipuai-api-key-here"

    # SSL 验证（公司内网可能需要设置为 false）
    verify_ssl: false

    # 是否使用代理（通过 HttpClientFactory 自动配置）
    use_proxy: true

# ==================== 模型配置 ====================
models:
  # LLM 配置
  llm:
    model: "glm-4-flash"     # 智谱AI 模型名称
    temperature: 0.7         # 温度参数（可选）

  # Embedding 配置
  embedding:
    model: "embedding-3"     # 智谱AI 嵌入模型名称

# ==================== Qdrant 向量数据库配置 ====================
qdrant:
  # 本地存储路径
  path: "./qdrant_db"

# ==================== HTTP 客户端配置 ====================
http:
  # 代理配置
  proxy:
    enabled: true
    http: "http://127.0.0.1:7890"
    https: "http://127.0.0.1:7890"

  # 超时配置（秒）
  timeout: 30

  # SSL 验证
  verify_ssl: false

# ==================== 日志配置 ====================
logging:
  level: "INFO"              # 日志级别: DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - [%(trace_id)s] - %(levelname)-5s - [%(threadName)s] - %(name)s:%(funcName)s:%(lineno)d - %(message)s"
